# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Short and direct. Report bugs and broken project rules, skip style nits that formatters catch."
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - "wip"
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/Package.resolved"
    - "!**/*.xcodeproj/**"
    - "!**/*.xcassets/**"
    - "!**/migrations/**/snapshot.json"
    - "!apps/api/public/art/**"
    - "!docs/images/**"
    - "!**/*.webp"
    - "!**/*.png"
  path_instructions:
    - path: "**/*"
      instructions: |
        Project rules (AGENTS.md):
        - Comments only where names and types can't say it: why, an invariant, a unit, a side
          effect, a failure, an outside rule. Flag comments about the change or its author
          ("added", "now", "fixed", "as requested", agent or model names) and dead code.
        - Never `--no-verify`, `eslint-disable`, `@ts-ignore`, `@ts-expect-error`, or loosened
          compiler options.
    - path: "**/*.swift"
      instructions: |
        - `switch` over the project's own enums is exhaustive, no `default`.
        - Typed throws (`throws(SomeError)`).
        - Explicit dependencies; no singletons or global containers.
        - Swift 6 strict concurrency: flag data races, `@unchecked Sendable`, `nonisolated(unsafe)`
          without a stated reason.
        - Files are PascalCase after their main type.
    - path: "**/*.ts"
      instructions: |
        - Effect code: errors are typed, no thrown exceptions across Effect boundaries.
        - No barrels (`index.ts` re-exports). No cross-package relative imports; use `exports`.
        - Only `packages/backend/platform` touches Worker bindings or runtime globals.
        - kebab-case file names.
    - path: "packages/contracts/**"
      instructions: |
        Effect Schema here is the source of truth for TS and Swift. Check the matching Swift
        wire types in `packages/ios/contracts` stay in sync and changes stay backward compatible
        with shipped app builds.
    - path: "**/package.json"
      instructions: 'Versions come from the `pnpm-workspace.yaml` catalog (`"catalog:"`).'
    - path: "**/migrations/**/*.sql"
      instructions: "Check the migration is safe on existing data and matches the Drizzle schema."
    - path: ".github/workflows/**"
      instructions: "Secrets come from Proton Pass (`pass://` references); flag hardcoded secrets or tokens."
  tools:
    swiftlint:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/architecture.md"
