name: Deploy

# Deploys the Alchemy stack to Cloudflare PRODUCTION. It can never run from a pull request or a
# push: the only trigger is a manual run (workflow_dispatch), and the job waits in the `prod`
# environment for the owner's approval (required reviewer, deployment branch `main` only).
#
# The secrets are the `prod` environment's secrets, copied from Proton Pass by
# scripts/sync-prod-secrets.sh; Proton Pass stays the source of truth. The `dev` stage is not
# deployed here: it has no GitHub environment and is deployed locally through `pp run`
# (docs/alchemy.md#deploying). See docs/alchemy.md#deploy-workflow.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy (only prod runs here)
        type: choice
        options: [prod]
        default: prod

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    timeout-minutes: 20
    env:
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm turbo run lint typecheck test format:check

      # Alchemy's output goes to a file first and is printed with the workers.dev address masked:
      # the logs of a public repository are public, and the subdomain names the account. The
      # account ID is a secret, so GitHub masks it; it is registered again here in case a value
      # reaches the log in another form. Names of missing secrets are printed, never values.
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_SIGN_IN_KEY: ${{ secrets.APPLE_SIGN_IN_KEY }}
          APPLE_SIGN_IN_KEY_ID: ${{ secrets.APPLE_SIGN_IN_KEY_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          set -uo pipefail
          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN APNS_KEY APNS_KEY_ID \
            APPLE_SIGN_IN_KEY APPLE_SIGN_IN_KEY_ID ACCESS_TEAM_DOMAIN ACCESS_AUD TMDB_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the prod environment:$missing. Run scripts/sync-prod-secrets.sh (docs/alchemy.md#deploy-workflow)."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          status=0
          pnpm exec alchemy deploy --stage "$STAGE" --yes --no-input > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          sed -E 's#https://[A-Za-z0-9.-]*workers\.dev#https://<masked>.workers.dev#g' "$RUNNER_TEMP/deploy.log"
          exit "$status"

      - name: Smoke test
        run: |
          set -uo pipefail
          url=$(grep -oE 'https://[A-Za-z0-9.-]*workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$url" ]; then echo "No Worker URL in the deploy output"; exit 1; fi
          echo "::add-mask::$url"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$url" || true)
          echo "Worker answered HTTP $code"
          test "$code" = "200"

      # The raw log is unmasked; remove it even when the deploy or the smoke test failed.
      - name: Remove deploy log
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.log"
