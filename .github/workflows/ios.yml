name: iOS

# Swift checks on a Mac runner. Path-filtered so TypeScript-only pull requests
# never start it; no branch filter on pull_request, so stacked PRs run too.
# A path-filtered workflow cannot be a required status check.
on:
  pull_request:
    paths: &paths
      - apps/ios/**
      - packages/ios/**
      - packages/contracts/**
      - .xcode-version
      - .swift-format
      - .github/workflows/ios.yml
      - .github/scripts/metal-toolchain.sh
      - .github/scripts/install-xcodegen.sh
      # Read by the app's bundle or the Swift tests.
      - packages/backend/flags/src/experiments.ts
      - packages/backend/dates/src/date-catalog.json
      - packages/backend/guess/src/question-catalog.json
      - "!**/*.md"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      shots:
        description: "UI test screenshots only: an -only-testing filter, e.g. NookiUITests/NeedBarsTests"
        required: false
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  # A newer commit supersedes a running check on main too: main moves faster than a run, and
  # finished runs that nobody waits for hold the few macOS runners.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Swift packages. No Simulator boots here: on one runner a first boot starves every other step.
  packages:
    if: inputs.shots == ''
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # As in ci.yml: the newest cache from an earlier commit lets Turbo skip the Swift package
      # tasks whose inputs did not change.
      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-ios-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-ios-${{ runner.os }}-

      - name: swift-format lint
        run: pnpm turbo run ios:format:check

      # Nobody reads an index on a runner; building it costs compile time.
      - name: Swift tests and fixture conformance
        run: pnpm turbo run ios:test -- --disable-index-store

      - name: Xcode build
        run: pnpm turbo run ios:build -- --disable-index-store

      # Saved even when a step failed: the tasks that passed are still worth replaying, and the
      # cache action's own post step saves only after a fully green job.
      - name: Save Turbo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-ios-${{ runner.os }}-${{ github.sha }}

  # The app's own tests on a Simulator of the newest iOS this Xcode has. Pull requests run the unit tests
  # (NookiTests, NookiWidgetsTests); the UI tests (NookiUITests) run on main and by hand.
  app:
    if: inputs.shots == ''
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      - name: Metal Toolchain
        run: .github/scripts/metal-toolchain.sh

      # A fresh runner's first Simulator boot takes minutes; it runs in the background while the app builds.
      # Started after the Metal Toolchain install, which it slows down.
      # Only plain iOS runtimes (iOS-27-2): a device-specific one (iOS-27-2-iPhone19-4) holds a single
      # resizable-scene iPhone whose window is wider than the app's layout, so taps and frames miss.
      - name: Boot the test Simulator
        run: |
          udid=$(xcrun simctl list -j devices available | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if re.search(r"\.iOS-[0-9]+(-[0-9]+)*$", k) and devices[k]),
                       key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")[:2] if x.isdigit()])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")] if ios else []
          print(phones[0]["udid"] if phones else "")')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone Simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "TEST_SIMULATOR=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl bootstatus "$udid" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - name: Install XcodeGen
        run: .github/scripts/install-xcodegen.sh

      # Xcode's compilation cache, keyed by file contents: a run replays what an earlier one compiled.
      # Keys only match at the same paths, which every run on these runners shares. Saved from main;
      # it never shrinks, so a new week starts a fresh one.
      - name: Compilation cache key
        id: cas
        run: echo "prefix=xcode-cas-${{ runner.os }}-$(cat .xcode-version)-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore the compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cas
          key: ${{ steps.cas.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cas.outputs.prefix }}

      - name: App tests (Simulator)
        # A hung UI test must not hold a runner for an hour; each test is also capped below.
        timeout-minutes: 30
        run: |
          (cd apps/ios && xcodegen generate --quiet)
          udid="$TEST_SIMULATOR"
          echo "Testing on $udid"
          echo "::group::Simulator boot"
          cat "$RUNNER_TEMP/simulator-boot.log" || true
          echo "::endgroup::"
          set -o pipefail
          status=0
          # TEST_RUNNER_ variables reach the tests without the prefix.
          export TEST_RUNNER_BILLET_SAMPLES="$RUNNER_TEMP/samples"
          # Tests that need a Simulator that can draw skip themselves on GITHUB_ACTIONS.
          export TEST_RUNNER_GITHUB_ACTIONS="$GITHUB_ACTIONS"
          skip=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then skip=(-skip-testing:NookiUITests); fi
          # Each test may run 3 min (5 at most); progress streams into the job log, the full log goes to the file.
          if ! xcodebuild test -project apps/ios/Billet.xcodeproj -scheme Billet \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/app-tests" \
            -resultBundlePath "$RUNNER_TEMP/app-tests.xcresult" "${skip[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/cas" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 \
            | tee "$RUNNER_TEMP/app-tests.log" \
            | { grep --line-buffered -E "Test Case '.*' (started|passed|failed)|exceeded execution time" || true; }; then
            status=1
          fi
          grep -E 'error:|✘|✔ Test run|Test .*(passed|failed)|\*\* TEST (SUCCEEDED|FAILED)' \
            "$RUNNER_TEMP/app-tests.log" || true
          if [ "$status" != 0 ]; then
            echo "::group::Last 120 lines of the test log"
            tail -n 120 "$RUNNER_TEMP/app-tests.log"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Save the compilation cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cas
          key: ${{ steps.cas.outputs.prefix }}${{ github.sha }}

      # Looks rendered by the app tests (NookiTests/PolaroidLookTests.swift), for review without a Simulator.
      - name: Keep the rendered samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: samples
          path: ${{ runner.temp }}/samples
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the app test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-tests-log
          # The result bundle holds the UI tests' screenshots and the app's crash reports.
          path: |
            ${{ runner.temp }}/app-tests.log
            ${{ runner.temp }}/app-tests.xcresult
          retention-days: 7

  # Before/after shots for UI pull requests: runs the chosen UI tests on a small and a large iPhone and keeps
  # their screenshot attachments. Dispatch with `gh workflow run ios.yml --ref <branch> -f shots=<filter>`.
  shots:
    if: inputs.shots != ''
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone SE (3rd generation)", "Pro Max"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      - name: Metal Toolchain
        run: .github/scripts/metal-toolchain.sh

      - name: Install XcodeGen
        run: .github/scripts/install-xcodegen.sh

      - name: UI tests and screenshots
        env:
          DEVICE: ${{ matrix.device }}
          ONLY: ${{ inputs.shots }}
          # xcodebuild hands TEST_RUNNER_ variables to the tests without the prefix; screenshot tests run only here.
          TEST_RUNNER_UISHOTS: "1"
          TEST_RUNNER_GITHUB_ACTIONS: "true"
        run: |
          # The newest runtime that supports the first device type whose name contains DEVICE.
          read -r runtime devtype <<<"$(xcrun simctl list -j runtimes | python3 -c '
          import json, os, sys
          want = os.environ["DEVICE"]
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["platform"] == "iOS"]
          runtimes.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          for r in reversed(runtimes):
              types = [t for t in r["supportedDeviceTypes"] if want in t["name"] and t["name"].startswith("iPhone")]
              if types:
                  print(r["identifier"], types[-1]["identifier"])
                  break')"
          if [ -z "$devtype" ]; then
            echo "::error::no runtime supports $DEVICE"
            exit 1
          fi
          udid=$(xcrun simctl create shots "$devtype" "$runtime")
          echo "Shooting on $devtype, $runtime ($udid)"
          (cd apps/ios && xcodegen generate --quiet)
          set -o pipefail
          status=0
          xcodebuild test -project apps/ios/Billet.xcodeproj -scheme Billet -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/shots.xcresult" \
            -only-testing:"$ONLY" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/shots.log" 2>&1 || status=$?
          grep -E 'error:|Test .*(passed|failed)|\*\* TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/shots.log" || true
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/shots.xcresult" \
            --output-path "$RUNNER_TEMP/shots" || true
          cp "$RUNNER_TEMP/shots.log" "$RUNNER_TEMP/shots/"
          exit "$status"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-${{ startsWith(matrix.device, 'iPhone SE') && 'SE' || 'ProMax' }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/shots.xcresult
          retention-days: 7
