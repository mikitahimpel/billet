name: iOS

# Swift checks on a Mac runner. Path-filtered so TypeScript-only pull requests
# never start it; no branch filter on pull_request, so stacked PRs run too.
# A path-filtered workflow cannot be a required status check.
on:
  pull_request:
    paths: &paths
      - apps/ios/**
      - packages/ios/**
      - packages/pet-scenes/**
      - packages/contracts/**
      - .xcode-version
      - .swift-format
      - .github/workflows/ios.yml
      - .github/scripts/metal-toolchain.sh
      - archive/ios-v1/**
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      shots:
        description: "UI test screenshots only: an -only-testing filter, e.g. NookiUITests/NeedBarsTests"
        required: false
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  # Pushes to main run to completion; only superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: inputs.shots == ''
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      - name: Metal Toolchain
        run: .github/scripts/metal-toolchain.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned release, verified by checksum, so project generation cannot drift.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: swift-format lint
        run: pnpm turbo run ios:format:check

      - name: Swift tests and fixture conformance
        run: pnpm turbo run ios:test

      - name: Xcode build
        run: pnpm turbo run ios:build

      # The app in apps/ios builds, shaders included; no tests yet.
      - name: App Release build (Simulator, unsigned)
        run: |
          (cd apps/ios && xcodegen generate --quiet)
          set -o pipefail
          xcodebuild build -project apps/ios/Billet.xcodeproj -scheme Billet -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/app" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/app.log" \
            | grep -E 'error:|\*\* BUILD (SUCCEEDED|FAILED)'

      # The app's own tests (NookiTests) on a Simulator of the newest iOS this Xcode has.
      - name: App tests (Simulator)
        run: |
          udid=$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k and devices[k]),
                       key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")[:2] if x.isdigit()])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")] if ios else []
          print(phones[0]["udid"] if phones else "")')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone Simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on $udid"
          set -o pipefail
          status=0
          xcodebuild test -project apps/ios/Billet.xcodeproj -scheme Billet \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/app-tests" \
            -resultBundlePath "$RUNNER_TEMP/app-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/app-tests.log" 2>&1 || status=$?
          grep -E 'error:|✘|✔ Test run|Test .*(passed|failed)|\*\* TEST (SUCCEEDED|FAILED)' \
            "$RUNNER_TEMP/app-tests.log" || true
          if [ "$status" != 0 ]; then
            echo "::group::Last 120 lines of the test log"
            tail -n 120 "$RUNNER_TEMP/app-tests.log"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Keep the app test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-tests-log
          # The result bundle holds the UI tests' screenshots and the app's crash reports.
          path: |
            ${{ runner.temp }}/app-tests.log
            ${{ runner.temp }}/app-tests.xcresult
          retention-days: 7

      # The App Store build of payments: generates the project with BILLET_PAYMENTS=storekit (read
      # from the environment by Package.swift and the app target) and buys every stamp pack from
      # apps/ios/App/Billet.storekit on a Simulator with StoreKitTest (docs/payments.md).
      # TODO: back with the Payments wiring; this tested the archived v1 app's StoreKit target.
      - name: StoreKit purchases on the Simulator
        if: false
        env:
          BILLET_PAYMENTS: storekit
        run: |
          # From iOS 26.4 on, Simulators don't get the .storekit file from `xcodebuild test`, so
          # StoreKitTest serves no products (seen on 26.4 and 26.5 here; developer.apple.com/forums/
          # thread/826971). On 27.2 the first purchase hangs. Run on the newest runtime before 26.3,
          # downloading iOS 26.2 when the runner has none.
          pick() {
            xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          v = lambda r: tuple(map(int, r["version"].split(".")))
          rs = sorted((r for r in json.load(sys.stdin)["runtimes"]
                       if r["platform"] == "iOS" and r["isAvailable"] and v(r)[:2] < (26, 3)), key=v)
          print(rs[-1]["identifier"] if rs else "")'
          }
          xcrun simctl list runtimes
          runtime=$(pick)
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion 26.2 2>&1 | grep -vE '^ *[0-9.]+%' | tail -n 5
            runtime=$(pick)
          fi
          if [ -z "$runtime" ]; then
            echo "::error::no iOS Simulator runtime before 26.3 on this runner"
            exit 1
          fi
          udid=$(xcrun simctl create storekit-tests "iPhone 17" "$runtime")
          echo "StoreKit tests on $runtime ($udid)"
          (cd apps/ios && xcodegen generate --quiet)
          set -o pipefail
          xcodebuild test -project apps/ios/Billet.xcodeproj -scheme BilletStoreKitTests \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/storekit" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/storekit.log" \
            | grep -E 'error:|Test Case .*(passed|failed)|\*\* TEST (SUCCEEDED|FAILED)|StoreKitPurchaseTests:'

  # Before/after shots for UI pull requests: runs the chosen UI tests on a small and a large iPhone and keeps
  # their screenshot attachments. Dispatch with `gh workflow run ios.yml --ref <branch> -f shots=<filter>`.
  shots:
    if: inputs.shots != ''
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone SE (3rd generation)", "Pro Max"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      - name: Metal Toolchain
        run: .github/scripts/metal-toolchain.sh

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: UI tests and screenshots
        env:
          DEVICE: ${{ matrix.device }}
          ONLY: ${{ inputs.shots }}
        run: |
          # The newest runtime that supports the first device type whose name contains DEVICE.
          read -r runtime devtype <<<"$(xcrun simctl list -j runtimes | python3 -c '
          import json, os, sys
          want = os.environ["DEVICE"]
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["platform"] == "iOS"]
          runtimes.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          for r in reversed(runtimes):
              types = [t for t in r["supportedDeviceTypes"] if want in t["name"] and t["name"].startswith("iPhone")]
              if types:
                  print(r["identifier"], types[-1]["identifier"])
                  break')"
          if [ -z "$devtype" ]; then
            echo "::error::no runtime supports $DEVICE"
            exit 1
          fi
          udid=$(xcrun simctl create shots "$devtype" "$runtime")
          echo "Shooting on $devtype, $runtime ($udid)"
          (cd apps/ios && xcodegen generate --quiet)
          set -o pipefail
          status=0
          xcodebuild test -project apps/ios/Billet.xcodeproj -scheme Billet -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/shots.xcresult" \
            -only-testing:"$ONLY" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/shots.log" 2>&1 || status=$?
          grep -E 'error:|Test .*(passed|failed)|\*\* TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/shots.log" || true
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/shots.xcresult" \
            --output-path "$RUNNER_TEMP/shots" || true
          cp "$RUNNER_TEMP/shots.log" "$RUNNER_TEMP/shots/"
          exit "$status"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-${{ startsWith(matrix.device, 'iPhone SE') && 'SE' || 'ProMax' }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/shots.xcresult
          retention-days: 7
