name: iOS

# Swift checks on a Mac runner. Path-filtered so TypeScript-only pull requests
# never start it; no branch filter on pull_request, so stacked PRs run too.
# A path-filtered workflow cannot be a required status check.
on:
  pull_request:
    paths: &paths
      - apps/ios/**
      - packages/ios/**
      - packages/contracts/**
      - .xcode-version
      - .swift-format
      - .github/workflows/ios.yml
      - .github/scripts/metal-toolchain.sh
      - .github/scripts/install-xcodegen.sh
      # Read by the app's bundle or the Swift tests.
      - packages/backend/flags/src/experiments.ts
      - packages/backend/dates/src/date-catalog.json
      - packages/backend/guess/src/question-catalog.json
      - "!**/*.md"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      shots:
        description: "UI test screenshots only: an -only-testing filter, e.g. OurioUITests/NeedBarsTests"
        required: false
        default: ""

env:
  # The Debug builds' compilation cache (project.yml) is for a Mac's worktrees; a runner starts empty.
  BILLET_COMPILATION_CACHE: "NO"

concurrency:
  group: ios-${{ github.ref }}
  # A pull request's newer commit supersedes its running check. On main a running check finishes, or
  # main, which moves faster than a run, never gets a verdict; only the newest waiting run is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The Swift packages. No Simulator boots here: on one runner a first boot starves every other step.
  packages:
    if: inputs.shots == ''
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # As in ci.yml: the newest cache from an earlier commit lets Turbo skip the Swift package
      # tasks whose inputs did not change.
      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-ios-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-ios-${{ runner.os }}-

      - name: swift-format lint
        run: pnpm turbo run ios:format:check

      # Nobody reads an index on a runner; building it costs compile time.
      - name: Swift tests and fixture conformance
        run: pnpm turbo run ios:test -- --disable-index-store

      - name: Xcode build
        run: pnpm turbo run ios:build -- --disable-index-store

      # Saved even when a step failed: the tasks that passed are still worth replaying, and the
      # cache action's own post step saves only after a fully green job.
      - name: Save Turbo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-ios-${{ runner.os }}-${{ github.sha }}

  # The app's own tests on a Simulator of the newest iOS this Xcode has. Pull requests run the unit tests
  # (OurioTests, OurioWidgetsTests); the UI tests (OurioUITests) run on main and by hand.
  app:
    if: inputs.shots == ''
    runs-on: xcode-27
    timeout-minutes: 65
    permissions:
      contents: read
      # Warmbuild signs in with the job's OIDC token. Pushes to main fill the cache, everything else only reads.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      # Remote compilation cache. It exports XCODE_XCCONFIG_FILE, which outranks BILLET_COMPILATION_CACHE; if it
      # cannot start, the build runs without it. On a pull request it also picks the unit tests the change can reach
      # (WARMBUILD_ONLY_TESTING); main runs them all and catches what a pull request skipped.
      - uses: mikitahimpel/warmbuild-action@2cbc67ebd376a088aefedef017364c6a7a6eccdd # v1.3.0
        id: warmbuild
        with:
          select-tests: true
          select-tests-ignore: |
            ^lint/
            ^scripts/

      - name: Metal Toolchain
        run: .github/scripts/metal-toolchain.sh

      # Picks the test Simulator; it boots after the build (App tests step).
      # Only plain iOS runtimes (iOS-27-2): a device-specific one (iOS-27-2-iPhone19-4) holds a single
      # resizable-scene iPhone whose window is wider than the app's layout, so taps and frames miss.
      - name: Pick the test Simulator
        run: |
          udid=$(xcrun simctl list -j devices available | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if re.search(r"\.iOS-[0-9]+(-[0-9]+)*$", k) and devices[k]),
                       key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")[:2] if x.isdigit()])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")] if ios else []
          print(phones[0]["udid"] if phones else "")')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone Simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "TEST_SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: .github/scripts/install-xcodegen.sh

      - name: App tests (Simulator)
        if: steps.warmbuild.outputs.tests != 'none'
        # A hung UI test must not hold a runner for an hour; each test is also capped below. On main the build
        # takes about 22 minutes without the compilation cache and the UI tests 10 to 17 more (a busy runner
        # took 39.5 of the 40 minutes this step once had and a slower one was cut off in the last test), so
        # the cap sits well above a slow but healthy run.
        timeout-minutes: 60
        run: |
          (cd apps/ios && xcodegen generate --quiet)
          udid="$TEST_SIMULATOR"
          echo "Testing on $udid"
          set -o pipefail
          status=0
          # TEST_RUNNER_ variables reach the tests without the prefix.
          export TEST_RUNNER_BILLET_SAMPLES="$RUNNER_TEMP/samples"
          # Tests that need a Simulator that can draw skip themselves on GITHUB_ACTIONS.
          export TEST_RUNNER_GITHUB_ACTIONS="$GITHUB_ACTIONS"
          skip=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then skip=(-skip-testing:OurioUITests); fi
          # Unquoted on purpose: one word per -only-testing/-skip-testing argument.
          skip+=(${WARMBUILD_ONLY_TESTING:-})
          # Each test may run 3 min (5 at most); progress streams into the job log, the full log goes to the file.
          # Building and testing are two runs so the summary can say how long each took.
          app=(-project apps/ios/Billet.xcodeproj -scheme Billet -destination "id=$udid"
            -derivedDataPath "$RUNNER_TEMP/app-tests" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO)
          # Seconds since the step started on every line, to see what the build and the tests wait for.
          stamp() { perl -MTime::HiRes=time -ne 'BEGIN { $| = 1 } printf "%7.1f %s", time - $ENV{STEP_START}, $_'; }
          started=$(date +%s)
          export STEP_START=$started
          if ! xcodebuild build-for-testing "${app[@]}" -resultBundlePath "$RUNNER_TEMP/app-build.xcresult" \
            -showBuildTimingSummary 2>&1 \
            | tee "$RUNNER_TEMP/app-tests.log" >(stamp >> "$RUNNER_TEMP/app-timeline.log") \
            | { grep --line-buffered -E 'error:' || true; }; then
            status=1
          fi
          built=$(date +%s)
          # Booted only now. A fresh Simulator's first boot keeps the runner's CPUs busy for minutes, and beside the
          # build it held xcodebuild's first project load for up to 6 minutes; after the build the build time is its own.
          xcrun simctl bootstatus "$udid" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 || true
          booted=$(date +%s)
          # Diagnostics after the tests (logs, spindumps) took minutes and nobody reads them on a green run.
          if [ "$status" = 0 ] && ! xcodebuild test-without-building "${app[@]}" -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/app-tests.xcresult" "${skip[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 2>&1 \
            | tee -a "$RUNNER_TEMP/app-tests.log" >(stamp >> "$RUNNER_TEMP/app-timeline.log") \
            | { grep --line-buffered -E "Test Case '.*' (started|passed|failed)|exceeded execution time" || true; }; then
            status=1
          fi
          timing="build $((built - started)) s, Simulator boot $((booted - built)) s, tests $(($(date +%s) - booted)) s"
          echo "App step: $timing"
          echo "::group::Build timing summary"
          sed -n '/Build Timing Summary/,/^\*\*/p' "$RUNNER_TEMP/app-tests.log" | head -n 60
          echo "::endgroup::"
          grep -E 'error:|✘|✔ Test run|Test .*(passed|failed)|\*\* TEST (SUCCEEDED|FAILED)' \
            "$RUNNER_TEMP/app-tests.log" || true
          # Where the build's minutes go on a runner: compiling, linking, asset catalogs, the Metal shader.
          {
            echo "### Build timing"
            echo "$timing"
            echo '```'
            sed -n '/Build Timing Summary/,/^\*\*/p' "$RUNNER_TEMP/app-tests.log" | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::group::Last 120 lines of the test log"
            tail -n 120 "$RUNNER_TEMP/app-tests.log"
            echo "::endgroup::"
          fi
          exit "$status"

      # Looks rendered by the app tests (OurioTests/PolaroidLookTests.swift), for review without a Simulator.
      - name: Keep the rendered samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: samples
          path: ${{ runner.temp }}/samples
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the app timeline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-timeline
          path: ${{ runner.temp }}/app-timeline.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the app test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-tests-log
          # The result bundle holds the UI tests' screenshots and the app's crash reports.
          path: |
            ${{ runner.temp }}/app-tests.log
            ${{ runner.temp }}/app-tests.xcresult
          retention-days: 7

  # Before/after shots for UI pull requests: runs the chosen UI tests on a small and a large iPhone and keeps
  # their screenshot attachments. Dispatch with `gh workflow run ios.yml --ref <branch> -f shots=<filter>`.
  shots:
    if: inputs.shots != ''
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone SE (3rd generation)", "Pro Max"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode from .xcode-version
        run: .github/scripts/select-xcode.sh .xcode-version

      - name: Metal Toolchain
        run: .github/scripts/metal-toolchain.sh

      - name: Install XcodeGen
        run: .github/scripts/install-xcodegen.sh

      - name: UI tests and screenshots
        env:
          DEVICE: ${{ matrix.device }}
          ONLY: ${{ inputs.shots }}
          # xcodebuild hands TEST_RUNNER_ variables to the tests without the prefix; screenshot tests run only here.
          TEST_RUNNER_UISHOTS: "1"
          TEST_RUNNER_GITHUB_ACTIONS: "true"
        run: |
          # The newest runtime that supports the first device type whose name contains DEVICE.
          read -r runtime devtype <<<"$(xcrun simctl list -j runtimes | python3 -c '
          import json, os, sys
          want = os.environ["DEVICE"]
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["platform"] == "iOS"]
          runtimes.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          for r in reversed(runtimes):
              types = [t for t in r["supportedDeviceTypes"] if want in t["name"] and t["name"].startswith("iPhone")]
              if types:
                  print(r["identifier"], types[-1]["identifier"])
                  break')"
          if [ -z "$devtype" ]; then
            echo "::error::no runtime supports $DEVICE"
            exit 1
          fi
          udid=$(xcrun simctl create shots "$devtype" "$runtime")
          echo "Shooting on $devtype, $runtime ($udid)"
          (cd apps/ios && xcodegen generate --quiet)
          set -o pipefail
          status=0
          xcodebuild test -project apps/ios/Billet.xcodeproj -scheme Billet -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/shots.xcresult" \
            -only-testing:"$ONLY" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/shots.log" 2>&1 || status=$?
          grep -E 'error:|Test .*(passed|failed)|\*\* TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/shots.log" || true
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/shots.xcresult" \
            --output-path "$RUNNER_TEMP/shots" || true
          cp "$RUNNER_TEMP/shots.log" "$RUNNER_TEMP/shots/"
          exit "$status"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-${{ startsWith(matrix.device, 'iPhone SE') && 'SE' || 'ProMax' }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/shots.xcresult
          retention-days: 7
