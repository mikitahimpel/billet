<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>billet admin</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/app.css" />
    <script type="module" src="/admin/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main" id="skip">Skip to content</a>
    <div class="shell">
      <aside class="side" aria-label="Sections">
        <a class="brand" href="#/overview" aria-label="billet admin, overview">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11.5 12 5l8 6.5V20H4z" />
            <rect x="10" y="13.5" width="4" height="6.5" rx="1" />
          </svg>
          <span class="brand-name">billet</span><span class="brand-sub">admin</span>
        </a>
        <nav class="nav">
          <p class="nav-group">Product</p>
          <a href="#/overview" data-route="overview">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 13.5h12M4 11V7M8 11V3M12 11V8" />
            </svg>
            Overview
          </a>
          <a href="#/events" data-route="events">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 8h2.5l2-4.5 3 9 2-4.5H14" />
            </svg>
            In the app
          </a>
          <a href="#/retention" data-route="retention">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 2.5h11v11h-11zM2.5 6.2h11M2.5 9.8h11M6.2 2.5v11M9.8 2.5v11" />
            </svg>
            Retention
          </a>
          <a href="#/funnels" data-route="funnels">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 3h12l-4.5 5v4.5l-3 1.5V8z" />
            </svg>
            Funnels
          </a>
          <p class="nav-group">Configure</p>
          <a href="#/experiments" data-route="experiments">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M6 2.5h4M6.5 2.5v4L3 13a.8.8 0 0 0 .7 1.2h8.6A.8.8 0 0 0 13 13L9.5 6.5v-4" />
            </svg>
            Experiments
          </a>
          <a href="#/flags" data-route="flags">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.5 14V2.5M3.5 3h8l-1.5 3 1.5 3h-8" />
            </svg>
            Flags
          </a>
          <a href="#/pairs" data-route="pairs">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="5.5" cy="6" r="2.5" />
              <circle cx="10.5" cy="6" r="2.5" />
              <path d="M1.5 13.5c.6-2 2.1-3 4-3s3.4 1 4 3M10.5 10.5c1.9 0 3.4 1 4 3" />
            </svg>
            Pairs
          </a>
          <p class="nav-group">Operate</p>
          <a href="#/maintenance" data-route="maintenance">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M10.2 2.3a3.5 3.5 0 0 0-4.4 4.4L2.3 10.2a1.4 1.4 0 0 0 2 2l3.5-3.5a3.5 3.5 0 0 0 4.4-4.4L10.5 6 9.5 6.5 9 5.5 9.5 4z"
              />
            </svg>
            Maintenance
          </a>
          <a href="#/purchases" data-route="purchases">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 4.5h11v8h-11zM2.5 7h11M5 10h2" />
            </svg>
            Purchases
          </a>
          <a href="#/onboarding" data-route="onboarding">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 3.5h10M3 8h10M3 12.5h6M11.5 11l1.5 1.5 2.5-3" />
            </svg>
            Onboarding
          </a>
          <a href="#/audit" data-route="audit">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 2.5h6l2.5 2.5v8.5H4zM6.5 7.5h4M6.5 10h4" />
            </svg>
            Audit log
          </a>
        </nav>
      </aside>
      <div class="frame">
        <header class="top">
          <span class="env" id="env" data-env="">…</span>
          <span class="top-gap"></span>
          <p class="updated">
            <span id="updated">Loading…</span>
            <button
              type="button"
              class="btn icon"
              id="refresh"
              aria-label="Reload this page's data"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3" />
              </svg>
            </button>
          </p>
          <p class="me"><span class="sr-only">Signed in as </span><span id="me-email">…</span></p>
        </header>
        <main id="main" class="main" tabindex="-1">
          <noscript><p class="empty">The admin panel needs JavaScript.</p></noscript>
        </main>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog
      id="confirm"
      class="dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-body"
    >
      <h2 id="confirm-title" class="dialog-title"></h2>
      <div id="confirm-body" class="dialog-body"></div>
      <div class="actions">
        <button type="button" class="btn" id="confirm-cancel" autofocus>Cancel</button>
        <button type="button" class="btn danger" id="confirm-ok">Confirm</button>
      </div>
    </dialog>
  </body>
</html>
