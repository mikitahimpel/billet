<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billet onboarding</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap"
    />
    <style>
      :root {
        --honey: #f2a65e;
        --honey-deep: #d9784a;
        --honey-light: #ffc27d;
        --blush: #ff8fa3;
        --heart: #ff5d73;
        --hero-ink: #3a2114;
        --sheet: #2a1a12;
        --primary: rgba(255, 255, 255, 0.96);
        --secondary: rgba(255, 255, 255, 0.72);
        --tertiary: rgba(255, 255, 255, 0.5);
        --hairline: rgba(255, 255, 255, 0.14);
        --card: rgba(255, 255, 255, 0.08);
        --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #140c07;
        color: var(--primary);
        font-family: var(--round);
        padding: 56px 16px 80px;
        -webkit-font-smoothing: antialiased;
      }
      .board {
        max-width: 1440px;
        margin: 0 auto;
      }
      .board > header {
        display: flex;
        gap: 48px;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 56px;
      }
      .board > header h1 {
        font-size: 56px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .board > header p {
        max-width: 520px;
        font-size: 16px;
        line-height: 23px;
        color: rgba(255, 255, 255, 0.55);
        font-weight: 600;
      }
      .flow {
        margin-bottom: 72px;
      }
      .flow > h2 {
        font-size: 15px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: var(--honey);
        margin-bottom: 28px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 40px 32px;
      }
      figure {
        width: 314px;
      }
      figcaption {
        margin-top: 18px;
        font-size: 13.5px;
        line-height: 19px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 600;
      }
      figcaption b {
        display: block;
        color: rgba(255, 255, 255, 0.92);
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 3px;
      }
      figcaption b span {
        color: var(--honey);
        margin-right: 6px;
      }

      /* ---------- Phone (402 × 874 pt, shown at 78%) ---------- */
      .device {
        zoom: 0.78;
        width: 402px;
        height: 874px;
        border-radius: 62px;
        padding: 6px;
        background: linear-gradient(145deg, #3b302a, #17110d 40%, #2b231e);
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .screen {
        position: relative;
        width: 390px;
        height: 862px;
        border-radius: 56px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        isolation: isolate;
        background:
          radial-gradient(60% 30% at 80% 18%, rgba(255, 190, 120, 0.22), transparent 70%),
          radial-gradient(70% 40% at 20% 62%, rgba(255, 170, 100, 0.25), transparent 70%),
          linear-gradient(180deg, #3e2616 0%, #6e4124 30%, #9a5f35 58%, #8a532d 78%, #4a2b18 100%);
      }
      .bokeh {
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }
      .bokeh i {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 214, 160, 0.28), rgba(255, 214, 160, 0) 70%);
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        translate: -50% 0;
        width: 124px;
        height: 36px;
        border-radius: 20px;
        background: #000;
        z-index: 20;
      }
      .status {
        height: 54px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 34px 0 46px;
        font-family: -apple-system, "SF Pro Text", system-ui;
        font-size: 17px;
        font-weight: 600;
        position: relative;
        z-index: 10;
      }
      .status .icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .home-ind {
        position: absolute;
        bottom: 8px;
        left: 50%;
        translate: -50% 0;
        width: 140px;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.85);
        z-index: 20;
      }
      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 8px 20px 34px;
        min-height: 0;
        position: relative;
      }
      .grow {
        flex: 1;
      }

      /* ---------- Kit ---------- */
      .glass {
        background: var(--card);
        border: 0.5px solid var(--hairline);
        backdrop-filter: blur(24px) saturate(1.3);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 48px;
        margin-bottom: 18px;
      }
      .round-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
      }
      .progress {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
        margin-right: 58px;
      }
      .progress b {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #ffc27d, #d9784a);
        box-shadow: 0 0 10px rgba(255, 170, 100, 0.6);
      }

      .mochi-says {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        margin-bottom: 10px;
      }
      .mochi-says .face {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        flex: none;
        overflow: hidden;
        background: radial-gradient(circle at 50% 35%, #fff4e4, #f2c08a);
        border: 2.5px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 6px 14px rgba(58, 33, 20, 0.35);
      }
      .mochi-says .face img {
        width: 118%;
        margin: 2px 0 0 -9%;
      }
      .mochi-says .bubble {
        font-size: 14px;
        font-weight: 700;
        color: var(--hero-ink);
        background: #fff6ea;
        padding: 9px 14px;
        border-radius: 18px 18px 18px 6px;
        box-shadow: 0 6px 14px rgba(58, 33, 20, 0.25);
        margin-bottom: 8px;
      }

      h1.title {
        font-size: 32px;
        line-height: 36px;
        font-weight: 800;
        letter-spacing: -0.6px;
        text-wrap: balance;
      }
      p.sub {
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        color: var(--secondary);
        margin-top: 8px;
        text-wrap: balance;
      }

      .cta {
        height: 58px;
        border-radius: 29px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 18px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #ffc27d, #d9784a);
        box-shadow:
          0 10px 22px rgba(217, 120, 74, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        text-shadow: 0 1px 2px rgba(120, 50, 20, 0.25);
      }
      .cta.ghost {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
        border: 0.5px solid var(--hairline);
        text-shadow: none;
      }
      .cta.apple {
        background: #fff;
        color: #000;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
        text-shadow: none;
        font-family: -apple-system, system-ui;
        font-weight: 600;
        font-size: 19px;
      }
      .cta.dim {
        opacity: 0.45;
        box-shadow: none;
      }
      .link {
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        color: var(--secondary);
        padding-top: 16px;
        height: 36px;
      }

      /* glossy app-icon tiles (as on the Us tab) */
      .tile {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        flex: none;
        position: relative;
        box-shadow:
          0 6px 14px rgba(40, 18, 8, 0.3),
          inset 0 1.5px 0 rgba(255, 255, 255, 0.55),
          inset 0 -2px 4px rgba(0, 0, 0, 0.12);
      }
      .tile::after {
        content: "";
        position: absolute;
        inset: 2px 3px 50% 3px;
        border-radius: 14px 14px 30px 30px;
        background: linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0));
      }
      .tile svg {
        width: 26px;
        height: 26px;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.18));
      }
      .t-yellow {
        background: linear-gradient(160deg, #ffe07a, #f4a92a);
      }
      .t-pink {
        background: linear-gradient(160deg, #ffb0c8, #e9679a);
      }
      .t-coral {
        background: linear-gradient(160deg, #ffb08e, #e8664e);
      }
      .t-blue {
        background: linear-gradient(160deg, #a8c2ff, #5f80e2);
      }
      .t-green {
        background: linear-gradient(160deg, #a9e58f, #4ea95e);
      }
      .t-violet {
        background: linear-gradient(160deg, #d2b2ff, #8c66de);
      }
      .t-sm {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }
      .t-sm svg {
        width: 21px;
        height: 21px;
      }

      .goal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .goal {
        position: relative;
        border-radius: 24px;
        padding: 14px 14px 16px;
        min-height: 132px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .goal b {
        font-size: 16px;
        line-height: 20px;
        font-weight: 800;
        display: block;
        margin-top: 12px;
      }
      .goal.on {
        background: linear-gradient(160deg, rgba(255, 200, 140, 0.3), rgba(217, 120, 74, 0.22));
        border: 2px solid #ffc27d;
        box-shadow:
          0 0 0 4px rgba(255, 194, 125, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .check {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      .on .check {
        background: linear-gradient(135deg, #ffc27d, #d9784a);
        border-color: #fff;
        display: grid;
        place-items: center;
      }
      .on .check::after {
        content: "";
        width: 10px;
        height: 5px;
        border-left: 2.5px solid #fff;
        border-bottom: 2.5px solid #fff;
        rotate: -45deg;
        translate: 0 -1px;
      }

      .choice {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 76px;
        border-radius: 24px;
        padding: 0 18px 0 14px;
        position: relative;
      }
      .choice b {
        font-size: 18px;
        font-weight: 800;
        display: block;
      }
      .choice small {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--secondary);
      }
      .choice .check {
        position: static;
        margin-left: auto;
      }
      .choice.on {
        background: linear-gradient(160deg, rgba(255, 200, 140, 0.3), rgba(217, 120, 74, 0.22));
        border: 2px solid #ffc27d;
        box-shadow: 0 0 0 4px rgba(255, 194, 125, 0.14);
      }

      /* wheel */
      .wheel {
        position: relative;
        border-radius: 28px;
        height: 236px;
        overflow: hidden;
        --fade: linear-gradient(transparent, #000 22%, #000 78%, transparent);
        display: flex;
        justify-content: center;
        gap: 26px;
      }
      .wheel .band {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 50%;
        height: 46px;
        translate: 0 -50%;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
      }
      .wheel .col {
        -webkit-mask-image: var(--fade);
        mask-image: var(--fade);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .wheel .col span {
        height: 38px;
        line-height: 38px;
      }
      .wheel .col .s3 {
        opacity: 0.14;
        transform: perspective(200px) rotateX(48deg) scale(0.86);
      }
      .wheel .col .s2 {
        opacity: 0.3;
        transform: perspective(200px) rotateX(32deg) scale(0.92);
      }
      .wheel .col .s1 {
        opacity: 0.55;
        transform: perspective(200px) rotateX(16deg) scale(0.97);
      }
      .wheel .col .s0 {
        font-size: 25px;
        font-weight: 800;
        height: 46px;
        line-height: 46px;
      }

      /* hero peach card (Us tab) */
      .hero {
        border-radius: 30px;
        padding: 20px;
        color: var(--hero-ink);
        background: linear-gradient(135deg, #f9cf98 0%, #f0a970 55%, #e48a5c 100%);
        box-shadow:
          0 14px 30px rgba(120, 55, 20, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .hero .num {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        background: rgba(255, 240, 225, 0.6);
        display: grid;
        place-items: center;
        text-align: center;
        flex: none;
        margin-left: auto;
      }
      .hero .num b {
        font-size: 34px;
        line-height: 34px;
        font-weight: 800;
        display: block;
        letter-spacing: -1px;
      }
      .hero .num span {
        font-size: 14px;
        font-weight: 700;
      }

      /* text field and keyboard */
      .field {
        height: 64px;
        border-radius: 22px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        font-size: 24px;
        font-weight: 800;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid #ffc27d;
        box-shadow: 0 0 0 4px rgba(255, 194, 125, 0.14);
      }
      .caret {
        width: 2.5px;
        height: 28px;
        border-radius: 2px;
        background: #ffc27d;
        margin-left: 2px;
      }
      .kb {
        margin: 0 -20px -34px;
        padding: 8px 3px 44px;
        background: rgba(40, 26, 18, 0.72);
        backdrop-filter: blur(30px);
        border-top: 0.5px solid rgba(255, 255, 255, 0.08);
        font-family: -apple-system, system-ui;
      }
      .kb .sugg {
        display: flex;
        justify-content: space-around;
        font-size: 16px;
        color: var(--primary);
        height: 36px;
        align-items: center;
        margin-bottom: 4px;
      }
      .kb .sugg span + span {
        border-left: 1px solid rgba(255, 255, 255, 0.15);
        padding-left: 30px;
      }
      .kb .r {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 11px;
      }
      .kb .k {
        width: 33px;
        height: 44px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.28);
        display: grid;
        place-items: center;
        font-size: 22px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      .kb .k.f {
        background: rgba(255, 255, 255, 0.14);
        width: 44px;
        font-size: 15px;
      }
      .kb .k.sp {
        width: 188px;
        font-size: 15px;
      }
      .kb .k.go {
        width: 88px;
        background: linear-gradient(135deg, #ffc27d, #d9784a);
        font-size: 15px;
        font-weight: 600;
      }

      /* monograms */
      .mono {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 27px;
        font-weight: 800;
        color: #fff;
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 18px rgba(40, 18, 8, 0.35);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }
      .mono.blue {
        background: linear-gradient(135deg, #9dbbf5, #6c89d9);
      }
      .mono.pink {
        background: linear-gradient(135deg, #f9b8cb, #e287a9);
      }
      .mono.empty {
        background: rgba(255, 255, 255, 0.08);
        border: 2.5px dashed rgba(255, 255, 255, 0.45);
        box-shadow: none;
        color: rgba(255, 255, 255, 0.6);
      }
      .heart-badge {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--blush);
        border: 2.5px solid #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .row-card {
        display: flex;
        align-items: center;
        gap: 14px;
        border-radius: 24px;
        padding: 14px 16px 14px 14px;
      }
      .row-card b {
        font-size: 16.5px;
        font-weight: 800;
        display: block;
      }
      .row-card small {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--secondary);
        line-height: 18px;
        display: block;
        margin-top: 1px;
      }
      .chev {
        margin-left: auto;
        opacity: 0.55;
      }

      .notif {
        border-radius: 24px;
        padding: 12px 14px;
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(30px);
        border: 0.5px solid rgba(255, 255, 255, 0.18);
        font-family: -apple-system, system-ui;
      }
      .notif .ai {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        flex: none;
        background:
          url(../images/shared/mochi-portrait.webp) 50% 20%/130% no-repeat,
          radial-gradient(#fff4e4, #f2c08a);
      }
      .notif .t {
        flex: 1;
        min-width: 0;
      }
      .notif b {
        font-size: 15px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
      }
      .notif b em {
        font-style: normal;
        font-weight: 400;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
      }
      .notif span {
        font-size: 14.5px;
        line-height: 19px;
        color: rgba(255, 255, 255, 0.88);
        display: block;
      }

      .code {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .code span {
        width: 46px;
        height: 60px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 800;
        background: rgba(255, 255, 255, 0.1);
        border: 0.5px solid var(--hairline);
      }
      .code span.cur {
        border: 2px solid #ffc27d;
        box-shadow: 0 0 0 4px rgba(255, 194, 125, 0.14);
      }
      .code i {
        align-self: center;
        width: 10px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.4);
      }

      .sheet {
        margin: 0 -20px -34px;
        padding: 26px 22px 44px;
        border-radius: 40px 40px 0 0;
        background: rgba(42, 26, 18, 0.82);
        backdrop-filter: blur(30px);
        border-top: 0.5px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 -20px 40px rgba(0, 0, 0, 0.25);
      }
      .grabber {
        width: 38px;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.28);
        margin: -14px auto 18px;
      }
      .seg {
        display: flex;
        padding: 4px;
        border-radius: 24px;
        flex: 1;
        margin-right: 58px;
      }
      .seg span {
        flex: 1;
        height: 38px;
        border-radius: 19px;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 800;
        color: var(--secondary);
      }
      .seg span.on {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 2px 8px rgba(40, 18, 8, 0.2);
      }
      .chip {
        height: 34px;
        padding: 0 13px;
        border-radius: 17px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.12);
        border: 0.5px solid var(--hairline);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="back" viewBox="0 0 24 24">
          <path
            d="M15 5 8 12l7 7"
            fill="none"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="chev" viewBox="0 0 24 24">
          <path
            d="m9 5 7 7-7 7"
            fill="none"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
