name: Billet
options:
  bundleIdPrefix: com.mikitahimpel
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2666YPBJTB
    CODE_SIGN_STYLE: Automatic
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "23"
packages:
  BilletContracts:
    path: ../../packages/ios/contracts
  BilletCore:
    path: ../../packages/ios/core
  BilletPet:
    path: ../../packages/ios/pet
  BilletFeatures:
    path: ../../packages/ios/features
targets:
  Billet:
    type: application
    platform: iOS
    # Shared: stores, palette and intents the widget extension compiles too.
    sources:
      - path: Nooki
      - path: Shared
    # The launch screen is the splash's own dark warm color (Assets LaunchBackground), see LaunchSplash; the rest
    # of Info.plist is generated from the INFOPLIST_KEY_ settings below.
    info:
      path: Nooki/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The billet server's host, from the BILLET_API_HOST environment variable at build time (see Server/Backend).
        BilletAPIHost: $(BILLET_API_HOST)
        # nooki:// links from the widgets and controls (Shared/Widget/DeepLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.mikitahimpel.billet
            CFBundleURLSchemes: [nooki]
    dependencies:
      - target: NookiWidgets
      - target: NookiNotifications
      - target: WindowViews
      - package: BilletContracts
        products: [Wire]
      - package: BilletCore
        products: [Ink, Persistence, Transport]
      - package: BilletPet
        products: [Pet, PetScene]
      - package: BilletFeatures
        products: [FeatureCanvas, FeatureOnboarding, FeaturePairing, WidgetBridge]
    entitlements:
      path: Nooki/Nooki.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
        keychain-access-groups: [$(AppIdentifierPrefix)com.mikitahimpel.billet]
        # Alert pushes for drawings; automatic signing switches it to production for TestFlight.
        aps-environment: development
        # Invite links, https://<server>/i/<code> (the Worker's app-links.ts).
        com.apple.developer.associated-domains: [applinks:$(BILLET_API_HOST)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet
        # The application preset sets "1,2" per target, over the project's base; a portrait-only iPad build is rejected.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Nooki
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The partner's drawing as a Live Activity, started by a push (Shared/Draw/DrawingActivity.swift).
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # The old app's flat window views (WindowViews/Views, without RealityKit or its resources), plus a
  # painter that turns one into images for the City room's window.
  WindowViews:
    type: library.static
    platform: iOS
    sources:
      - path: WindowViews
    dependencies:
      - package: BilletPet
        product: Pet
  NookiWidgets:
    type: app-extension
    platform: iOS
    sources: [NookiWidgets, Shared]
    info:
      path: NookiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nooki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NookiWidgets/NookiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
    dependencies:
      - package: BilletContracts
        products: [Wire]
      - package: BilletCore
        products: [Ink]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.widget
        # Extensions keep Swift's default isolation; Shared types that cross into App Intents are marked nonisolated.
        SKIP_INSTALL: YES
  # Writes the drawing a push carries to the App Group and reloads the drawing widgets, before the alert shows.
  NookiNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NookiNotifications
      # The Live Activity attributes need ActivityKit, which this extension has no use for.
      - path: Shared
        excludes: [Draw/DrawingActivity.swift]
    info:
      path: NookiNotifications/Info.plist
      properties:
        CFBundleDisplayName: Nooki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NookiNotifications/NookiNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
    dependencies:
      - package: BilletContracts
        products: [Wire]
      - package: BilletCore
        products: [Ink]
    settings:
      base:
        # The id the first app's notification service registered, so automatic signing finds it.
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.notification-service
        SKIP_INSTALL: YES
  NookiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NookiTests]
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  NookiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NookiUITests]
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Billet
schemes:
  Billet:
    build:
      targets:
        Billet: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [NookiTests, NookiUITests]
    archive:
      config: Release
