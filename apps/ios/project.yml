name: Billet
options:
  bundleIdPrefix: com.mikitahimpel
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    GENERATE_INFOPLIST_FILE: YES
  configs:
    # Release only: CI and Simulator builds are Debug with CODE_SIGNING_ALLOWED=NO.
    Release:
      DEVELOPMENT_TEAM: 2666YPBJTB
      CODE_SIGN_STYLE: Automatic
packages:
  Billet:
    path: ../../packages/ios
targets:
  Billet:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Billet
        product: FeatureHome
      - target: BilletWidget
      - target: BilletNotificationService
    entitlements:
      path: App/Billet.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
        keychain-access-groups: [$(AppIdentifierPrefix)com.mikitahimpel.billet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: App/Info.plist
        # Temporary icon from the Little House art, until the real mark lands in #35.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: billet
  BilletWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    dependencies:
      - package: Billet
        product: Surfaces
    entitlements:
      path: Widget/BilletWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
        keychain-access-groups: [$(AppIdentifierPrefix)com.mikitahimpel.billet]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: billet
  BilletNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    dependencies:
      - package: Billet
        product: Delivery
    entitlements:
      path: NotificationService/BilletNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
        keychain-access-groups: [$(AppIdentifierPrefix)com.mikitahimpel.billet]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.notification-service
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: billet
schemes:
  Billet:
    build:
      targets:
        Billet: all
