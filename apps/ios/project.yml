name: Billet
options:
  bundleIdPrefix: com.mikitahimpel
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2666YPBJTB
    CODE_SIGN_STYLE: Automatic
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    # Which store sells coin packs: "mock" (the default: fake store, the dev server credits) or "storekit". Set it
    # in the ENVIRONMENT, not as an xcodebuild argument: Package.swift reads the same variable to link only that
    # store (docs/payments.md).
    BILLET_PAYMENTS_MODE: $(BILLET_PAYMENTS:default=mock)
    # Whether Settings > Labs and Testing are compiled into a Release build: "NO" unless BILLET_LABS=YES is in the
    # environment. A Debug build always has them. The TestFlight workflow never sets it, because the binary it
    # uploads is the one App Review and the App Store get (check-archive.sh checks BilletLabs).
    BILLET_LABS_MODE: $(BILLET_LABS:default=NO)
    # Whether the `-perf.script` measuring hooks (OurioPerf, ScenePerf) are compiled into a Release build: "NO" unless
    # BILLET_PERF_HOOKS=YES is in the ENVIRONMENT (Package.swift of `pet` reads it too). Only the perf CI sets it;
    # check-archive.sh fails an archive that carries them.
    BILLET_PERF_HOOKS_MODE: $(BILLET_PERF_HOOKS:default=NO)
    CURRENT_PROJECT_VERSION: "23"
    # Images and colours are looked up by name, never through generated `ImageResource`/`ColorResource` symbols.
    # Generating them costs a minute or more per target on a fresh runner, and every Swift file waits for it.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  configs:
    Debug:
      # One compilation cache for every worktree on the Mac: a fresh checkout reuses what another one compiled from
      # the same source. CI sets BILLET_COMPILATION_CACHE=NO; on a runner it was slower than building. A broken
      # cache is fixed by deleting the folder; scripts/trim-compilation-cache.sh keeps it under 10 GB.
      COMPILATION_CACHE_ENABLE_CACHING: $(BILLET_COMPILATION_CACHE:default=YES)
      COMPILATION_CACHE_CAS_PATH: $(HOME)/Library/Caches/billet-compilation-cache
packages:
  BilletContracts:
    path: ../../packages/ios/contracts
  BilletCore:
    path: ../../packages/ios/core
  BilletDesign:
    path: ../../packages/ios/design
  BilletPet:
    path: ../../packages/ios/pet
  BilletFeatures:
    path: ../../packages/ios/features
  BilletPayments:
    path: ../../packages/ios/payments
targets:
  Billet:
    type: application
    platform: iOS
    sources:
      - path: Nooki
      # Shared: the images and the map the app and its extensions bundle. PerTarget holds the intents and the Live
      # Activity, whose metadata each target extracts from its own sources.
      - path: Shared
      - path: PerTarget
      # The widgets' views, drawn live by the widget gallery in Settings.
      - path: OurioWidgets/WidgetFacts.swift
      - path: OurioWidgets/FamilyViews.swift
      - path: OurioWidgets/LockViews.swift
      - path: OurioWidgets/Theme.swift
      # The date ideas the build ships with: the server's own catalog file (packages/ios/features/Sources/UsInterface/DateCatalog.swift).
      - path: ../../packages/backend/dates/src/date-catalog.json
        buildPhase: resources
      # The Who knows who questions the build ships with (Nooki/Model/GuessCatalog.swift).
      - path: ../../packages/backend/guess/src/question-catalog.json
        buildPhase: resources
    # The launch screen is the splash's own dark warm color (Assets LaunchBackground), see LaunchSplash; the rest
    # of Info.plist is generated from the INFOPLIST_KEY_ settings below.
    info:
      path: Nooki/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The billet server's host, from the BILLET_API_HOST environment variable at build time (see Server/Backend).
        BilletAPIHost: $(BILLET_API_HOST)
        # What the build carries, for check-archive.sh: the store (mock or storekit) and Labs (YES or NO).
        BilletPayments: $(BILLET_PAYMENTS_MODE)
        BilletLabs: $(BILLET_LABS_MODE)
        # The invite step scans the partner's QR code (FeatureOnboarding/InviteScanner).
        NSCameraUsageDescription: Ourio uses the camera to scan the invite code on your partner's screen.
        # ourio:// links from the widgets and controls, and nooki:// from invites sent before the rename
        # (WidgetInterface/DeepLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.ourio.app
            CFBundleURLSchemes: [ourio, nooki]
    dependencies:
      - target: OurioWidgets
      - target: OurioNotifications
      - target: OurioShare
      - target: WindowViews
      - package: BilletContracts
        products: [Wire]
      - package: BilletCore
        products: [BilletKit, Ink, Persistence, Transport]
      - package: BilletDesign
        products: [Design]
      - package: BilletPet
        products: [Pet, PetScene]
      - package: BilletFeatures
        products:
          [
            FeatureCanvas,
            FeatureDecor,
            FeatureGames,
            FeatureInbox,
            FeatureMood,
            FeatureMoments,
            FeatureOnboarding,
            FeaturePairing,
            FeatureShop,
            FeatureUs,
            DecorInterface,
            DrawInterface,
            GamesInterface,
            MomentsInterface,
            MoodInterface,
            ProfileInterface,
            RoomInterface,
            ShopInterface,
            UsInterface,
            WidgetBridge,
            WidgetInterface,
            WidgetUI,
          ]
      - package: BilletPayments
        products: [Payments, PaymentsLive]
    entitlements:
      path: Nooki/Ourio.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ourio.app]
        keychain-access-groups: [$(AppIdentifierPrefix)com.ourio.app]
        # Alert pushes for drawings; automatic signing switches it to production for TestFlight.
        aps-environment: development
        # Invite links, https://<server>/i/<code> (the Worker's app-links.ts).
        com.apple.developer.associated-domains: [applinks:$(BILLET_API_HOST)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourio.app
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: >-
          $(inherited) PAYMENTS_$(BILLET_PAYMENTS_MODE:upper) LABS_$(BILLET_LABS_MODE:upper) PERF_HOOKS_$(BILLET_PERF_HOOKS_MODE:upper)
        # The application preset sets "1,2" per target, over the project's base; a portrait-only iPad build is rejected.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Ourio
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The partner's drawing as a Live Activity, started by a push (PerTarget/DrawingActivity.swift).
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # The old app's flat window views (WindowViews/Views, without RealityKit or its resources), plus a
  # view that draws one at screen pixels behind the City room's window.
  WindowViews:
    type: library.static
    platform: iOS
    sources:
      - path: WindowViews
    dependencies:
      - package: BilletPet
        product: Pet
  OurioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OurioWidgets
      - path: Shared
        # Places' map is for the app's world map only.
        excludes: [Places/WorldMap.txt]
      - path: PerTarget
      - path: ../../packages/backend/dates/src/date-catalog.json
        buildPhase: resources
    info:
      path: OurioWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ourio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OurioWidgets/OurioWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ourio.app]
    dependencies:
      - package: BilletContracts
        products: [Wire]
      - package: BilletCore
        products: [Ink, Persistence]
      - package: BilletDesign
        products: [Design]
      - package: BilletPet
        products: [Pet]
      - package: BilletFeatures
        products:
          [DrawInterface, MomentsInterface, MoodInterface, ProfileInterface, ShopInterface, UsInterface, WidgetInterface, WidgetUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourio.app.widget
        # Extensions keep Swift's default isolation; Shared types that cross into App Intents are marked nonisolated.
        SKIP_INSTALL: YES
  # Writes the drawing a push carries to the App Group and reloads the drawing widgets, before the alert shows.
  OurioNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: OurioNotifications
      # The evening nudge a streak push plans again.
      - path: Nooki/Model/StreakNudge.swift
      # The Live Activity attributes need ActivityKit, which this extension has no use for.
      - path: Shared
        # Places' map is for the app's world map only.
        excludes: [Places/WorldMap.txt]
      - path: PerTarget
        excludes: [DrawingActivity.swift]
    info:
      path: OurioNotifications/Info.plist
      properties:
        CFBundleDisplayName: Ourio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: OurioNotifications/OurioNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ourio.app]
    dependencies:
      - package: BilletContracts
        products: [Wire]
      - package: BilletCore
        products: [Ink, Persistence]
      - package: BilletDesign
        products: [Design]
      - package: BilletFeatures
        products: [DrawInterface, MomentsInterface, MoodInterface, ProfileInterface, UsInterface, WidgetInterface, WidgetUI]
    settings:
      base:
        # The id the first app's notification service registered, so automatic signing finds it.
        PRODUCT_BUNDLE_IDENTIFIER: com.ourio.app.notification-service
        SKIP_INSTALL: YES
  # The share sheet's "Ourio" action: a page shared from Safari or another app becomes a wish.
  OurioShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OurioShare
      - path: Shared
        # Places' map is for the app's world map only.
        excludes: [Places/WorldMap.txt]
      - path: PerTarget
        excludes: [DrawingActivity.swift]
    info:
      path: OurioShare/Info.plist
      properties:
        CFBundleDisplayName: Ourio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: OurioShare/OurioShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ourio.app]
    dependencies:
      - package: BilletContracts
        products: [Wire]
      - package: BilletCore
        products: [Ink, Persistence]
      - package: BilletDesign
        products: [Design]
      - package: BilletFeatures
        products: [DrawInterface, MomentsInterface, MoodInterface, ProfileInterface, UsInterface, WidgetInterface, WidgetUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourio.app.share
        SKIP_INSTALL: YES
  # The widgets' views rendered into BILLET_SAMPLES for review (WidgetGalleryTests). An extension can't host tests, so
  # the widget sources are compiled in, without their @main bundle; the app hosts it so their images load.
  OurioWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OurioWidgetsTests
      - path: OurioWidgets
        excludes: [Widgets.swift]
      - path: PerTarget
    # Wire, Ink and the interfaces come from the app it is loaded into, as for OurioTests: linking them here as well
    # makes Xcode build them as frameworks, and OurioTests then finds none of their symbols.
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourio.app.widget-tests
        GENERATE_INFOPLIST_FILE: YES
  OurioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OurioTests]
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourio.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  OurioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OurioUITests]
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourio.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Billet
schemes:
  Billet:
    build:
      targets:
        Billet: all
      preActions:
        - name: Trim the compilation cache
          settingsTarget: Billet
          script: '"$SRCROOT/scripts/trim-compilation-cache.sh"'
    run:
      config: Debug
    test:
      config: Debug
      targets: [OurioTests, OurioWidgetsTests, OurioUITests]
    archive:
      config: Release
