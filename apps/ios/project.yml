name: Billet
options:
  bundleIdPrefix: com.mikitahimpel
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2666YPBJTB
    CODE_SIGN_STYLE: Automatic
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "23"
packages:
  BilletPackages:
    path: ../../packages/ios
targets:
  Billet:
    type: application
    platform: iOS
    # Shared: stores, palette and intents the widget extension compiles too.
    sources:
      - path: Nooki
      - path: Shared
    # The launch screen is the splash's own dark warm color (Assets LaunchBackground), see LaunchSplash; the rest
    # of Info.plist is generated from the INFOPLIST_KEY_ settings below.
    info:
      path: Nooki/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The billet server's host, from the BILLET_API_HOST environment variable at build time (see Server/Backend).
        BilletAPIHost: $(BILLET_API_HOST)
    dependencies:
      - target: NookiWidgets
      - package: BilletPackages
        products: [FeatureOnboarding, Persistence, Transport, Wire]
    entitlements:
      path: Nooki/Nooki.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
        keychain-access-groups: [$(AppIdentifierPrefix)com.mikitahimpel.billet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet
        # The application preset sets "1,2" per target, over the project's base; a portrait-only iPad build is rejected.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Nooki
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  NookiWidgets:
    type: app-extension
    platform: iOS
    sources: [NookiWidgets, Shared]
    info:
      path: NookiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nooki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NookiWidgets/NookiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikitahimpel.billet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.widget
        # Extensions keep Swift's default isolation; Shared types that cross into App Intents are marked nonisolated.
        SKIP_INSTALL: YES
  NookiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NookiTests]
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikitahimpel.billet.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
schemes:
  Billet:
    build:
      targets:
        Billet: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [NookiTests]
    archive:
      config: Release
