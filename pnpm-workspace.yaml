packages:
  - apps/*
  - packages/*/*

allowBuilds:
  workerd: true

overrides:
  # @effect/platform-node 4.0.6 would otherwise resolve this to 4.1.x, which needs effect 4.1.
  "@effect/platform-node-shared": 4.0.6

catalog:
  # Alchemy v2 is beta: pin exact, bump alchemy, @alchemy.run/*, drizzle-orm and drizzle-kit together
  # (see docs/alchemy.md). drizzle-orm and drizzle-kit are a release candidate, and
  # @alchemy.run/drizzle peers on exactly this build.
  alchemy: 2.0.0-beta.84
  "@alchemy.run/cloudflare": 2.0.0-beta.84
  "@alchemy.run/drizzle": 2.0.0-beta.84
  "@alchemy.run/sql": 2.0.0-beta.84
  # Better Auth and its Kysely adapter release together: bump them as one. kysely is the version
  # that adapter resolves to.
  "@better-auth/kysely-adapter": 1.7.15
  better-auth: 1.7.15
  "@cloudflare/vitest-pool-workers": 0.23.0
  "@cloudflare/workers-types": 5.20261101.1
  "@effect/sql-d1": 4.1.1
  "@effect/sql-sqlite-do": 4.1.1
  "@types/node": 24.19.2
  # Landing (apps/landing): Astro bundles its own Vite 8.
  astro: 7.4.5
  "@astrojs/react": 7.1.2
  "@fontsource-variable/nunito": 5.3.0
  "@fontsource/dm-mono": 5.3.0
  "@react-three/drei": 10.7.9
  "@react-three/fiber": 9.8.2
  "@sparkjsdev/spark": 2.4.0
  "@tailwindcss/vite": 4.3.4
  "@types/qrcode": 1.5.6
  "@types/three": 0.187.0
  qrcode: 1.5.4
  three: 0.187.0
  ultrahtml: 1.7.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  motion: 14.9.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.4
  drizzle-kit: 1.0.0-rc.5-ab785fc
  drizzle-orm: 1.0.0-rc.5-ab785fc
  effect: 4.1.1
  kysely: 0.29.8
  oxfmt: 0.75.0
  oxlint: 1.90.0
  turbo: 2.11.10
  typescript: 7.0.2
  # @cloudflare/vitest-pool-workers 0.23 peers on vitest ^4.1.0, so vitest stays on 4.x.
  vitest: ^4.1.0

catalogs:
  # Alchemy 2.0.0-beta.84 imports `effect/Crypto`, which effect 4.1 moved to `effect/crypto`, so the
  # root infra tooling stays on effect 4.0.x until Alchemy supports 4.1. Only the root uses this.
  infra:
    effect: 4.0.6
    "@effect/platform-node": 4.0.6

patchedDependencies:
  # 0.23.0 stacks one more Proxy on the entrypoint's prototype per `exports.default.fetch`, so each
  # call is slower than the last. @cloudflare/vitest-plugin 1.3.0 has the same fix; drop this there.
  "@cloudflare/vitest-pool-workers@0.23.0": patches/@cloudflare__vitest-pool-workers@0.23.0.patch
